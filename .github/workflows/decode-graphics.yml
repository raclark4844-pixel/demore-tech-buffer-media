name: Decode Tech Facebook graphics
on:
  push:
    paths:
      - "encoded/**"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 PNGs
        run: |
          set -euo pipefail
          mkdir -p fb
          for f in encoded/fb/*.png.b64; do
            out="fb/$(basename "${f%.b64}")"
            base64 -d "$f" > "$out"
            file "$out"
          done
      - name: Commit PNG graphics
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fb/*.png
          if git diff --cached --quiet; then
            echo "No PNG changes to commit"
          else
            git commit -m "Add decoded Tech Facebook graphics"
            git pull --rebase
            git push
          fi
